[workspace]
members = [
    "sugarloaf",
    "teletypewriter",
    "corcovado",
    "rio-graphics",
    "rio-vt",
    "rio-backend",
    "rio-grapheme-width",
    "rio-window",
    "rio-notifier",
    "frontends/rioterm",
    "librio",
]
resolver = "2"

[workspace.package]
version = "0.5.7"
authors = ["Raphael Amorim <rapha850@gmail.com>"]
edition = "2021"
license = "MIT"
keywords = ["graphics", "terminal", "application"]
rust-version = "1.96.1"
repository = "https://github.com/raphamorim/rio"
homepage = "https://rioterm.com"
documentation = "https://github.com/raphamorim/rio#readme"
readme = "README.md"

[workspace.dependencies]
# Note: https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html#multiple-locations
# Sugarloaf example uses path when used locally, but uses
# version from crates.io when published.
teletypewriter = { path = "teletypewriter", version = "0.5.7" }
rio-backend = { path = "rio-backend", version = "0.5.7" }
rio-window = { path = "rio-window", version = "0.5.7", default-features = false }
rio-notifier = { path = "rio-notifier", version = "0.5.7" }
rio-grapheme-width = { path = "rio-grapheme-width", version = "0.5.7" }
sugarloaf = { path = "sugarloaf", version = "0.5.7" }
corcovado = { path = "corcovado", version = "0.5.7" }
rio-graphics = { path = "rio-graphics", version = "0.5.7" }
rio-vt = { path = "rio-vt", version = "0.5.7" }

raw-window-handle = { version = "0.6.2", features = ["std"] }
parking_lot = { version = "0.12.5", features = [
    "nightly",
    "hardware-lock-elision",
] }
rustc-hash = "2.1.3"
smallvec = { version = "1.15.2", default-features = false }

# unicode-width = "0.2.0"
unicode-width = { package = "unicode-width-16", version = "0.1.0" }
simdutf = "0.7.0"
base64 = "0.23.0"
image_rs = { package = "image", version = "0.25.10", default-features = false, features = [
    "gif",
    "jpeg",
    "ico",
    "png",
    "pnm",
    "webp",
    "bmp",
    "tiff",
] }
regex = "1.12.3"
onig = { version = "6.5.3", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
wgpu = "30.0.0"
libc = "0.2.189"
smol_str = "0.3.2"
futures = "0.3.31"
zbus = "4.4.0"
wasm-bindgen = "0.2.87"
wasm-bindgen-futures = "0.4.34"
wasm-bindgen-test = "0.3.42"
env_logger = "0.11.8"
console_log = "0.2.2"
bitflags = "2.9.0"
iovec = "0.1.4"
console_error_panic_hook = "0.1.7"
tracing = "0.1.41"
objc = { package = "objc-rs", version = "0.3.2" }
memmap2 = "0.9.11"
url = "2.5.4"
criterion = { version = "0.6.0", features = ["html_reports"] }
dashmap = "6.2.1"
flate2 = "1.1.9"

[profile.release]
debug = "limited"
lto = true
codegen-units = 1

[profile.librio]
inherits = "release"
strip = "none"
debug = false
lto = false

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
