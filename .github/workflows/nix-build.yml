name: Nix Build

on:
  workflow_dispatch:
  # PRs build the flake only when they touch what the flake consumes;
  # every merge to main still builds it against the full tree, so a
  # regression from ordinary Rust changes is caught one merge later
  # instead of charging every PR push ~10-30 min.
  pull_request:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'pkgRio.nix'
      - 'Cargo.lock'
      - '.github/workflows/nix-build.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'pkgRio.nix'
      - '.github/workflows/nix-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lints:
    name: Build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    # flakehub-cache authenticates via OIDC; without these permissions it
    # silently disables itself and falls back to the GHA cache.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      # User-facing binary cache: flake users add rioterm.cachix.org as a
      # substituter (the flake's nixConfig offers it) and download rio
      # instead of building it. Only main builds are pushed.
      - uses: cachix/cachix-action@v17
        with:
          name: rioterm
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
      - uses: DeterminateSystems/flake-checker-action@main
      - run: nix build --max-jobs auto --build-max-jobs auto --print-build-logs
