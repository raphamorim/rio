name: Test

on:
  push:
    # Pushes to any other branch with an open PR already run the
    # pull_request event; triggering both doubled every job.
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  CARGO_INCREMENTAL: 0
  # Line-level debug info is dead weight in CI: it multiplies target-dir
  # size, which is what cache upload/download and the 10GB repo cache
  # eviction actually pay for. Backtraces keep function names.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test-native:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install stable --profile minimal
      - run: rustup component add rustfmt clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -yq && sudo apt-get install -yq libasound2-dev libfontconfig1-dev glslang-tools
      - run: cargo fetch
      - name: cargo fmt
        # Formatting is platform-independent; once is enough.
        if: runner.os == 'Linux'
        run: cargo fmt -- --check --color always
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --features wgpu ${{ runner.os == 'Linux' && '--timings' || '' }}
      - name: Upload build timings
        # One HTML per run showing which crates dominated and whether the
        # cache actually hit; download it when CI feels slow.
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings
          path: target/cargo-timings/
          if-no-files-found: ignore
  msys2-build-test: #cargo test doesn't necessarily build the exec we want
    # PR-only smoke of the modern default flavor; the full 3-flavor
    # release-profile matrix runs as a gate in release.yml instead of
    # on every main push.
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        sys: [UCRT64]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        # Reuse the MSYS2 preinstalled on the runner image instead of
        # downloading a fresh one, and skip the full pacman system
        # upgrade: the snapshot is fresh enough for a build check.
        release: false
        update: false
        install: base-devel git
        pacboy: >-
          rust:p
          cc:p
          pkgconf:p
          cmake:p
          freetype:p
          python:p
          fontconfig:p

    - name: Cache target dir
      uses: actions/cache@v4
      with:
        path: target
        key: msys2-${{ matrix.sys }}-debug-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: msys2-${{ matrix.sys }}-debug-

    - name: Build (smoke, debug)
      shell: msys2 {0}
      run: cargo build --features wgpu
