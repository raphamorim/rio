[package]
name = "librio"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
repository = "https://github.com/raphamorim/rio"
description = "Embeddable terminal core extracted from Rio: PTY, VT state, render-state pull API, exposed as a C ABI"
readme = "README.md"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
rio-vt = { path = "../rio-vt", version = "0.5.0" }
rio-fonts = { workspace = true, features = ["symbols-nerd-font"] }
teletypewriter = { workspace = true }
corcovado = { workspace = true }
rustc-hash = { workspace = true }
bitflags = { workspace = true }
tracing = { workspace = true }
