[package]
name = "librio"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
repository = "https://github.com/raphamorim/rio"
description = "Embeddable terminal core extracted from Rio: PTY, VT state, render-state pull API, exposed as a C ABI"
readme = "README.md"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
rio-vt = { path = "../rio-vt", version = "0.5.0", default-features = false, features = ["graphics"] }
rio-fonts = { workspace = true, features = ["symbols-nerd-font"] }
rio-graphics = { workspace = true }
rustc-hash = { workspace = true }
bitflags = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
teletypewriter = { workspace = true, optional = true }
corcovado = { workspace = true, optional = true }

[features]
# PTY on by default: surfaces spawn a shell and pump it on an IO thread.
# Without it (the wasm/web build) the host is the transport: bytes the
# terminal wants sent to the child go to `SurfaceDelegate::output`, and
# child output comes back in through `Surface::feed`.
default = ["pty"]
pty = ["rio-vt/pty", "dep:teletypewriter", "dep:corcovado"]
