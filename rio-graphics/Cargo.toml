[package]
name = "rio-graphics"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
repository = "https://github.com/raphamorim/rio"
description = "Terminal graphics value types (sixel/kitty/iTerm2 image data, glyph protocol) extracted from Rio"

[dependencies]
image_rs = { workspace = true, optional = true }
tracing = { workspace = true }
rustc-hash = { workspace = true }
skrifa = { version = "0.37.0", optional = true }
parking_lot = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[features]
default = []
# Image decode/resize helpers (the `image` crate). Off by default so the
# value types stay lean; enabled by embedders that handle image protocols.
image = ["dep:image_rs"]
# The glyph protocol decoder pulls a font-outline parser (skrifa). Off by
# default so an embedder that only wants image graphics stays lean.
glyph = ["dep:skrifa", "dep:parking_lot"]
# `From<Color>`/`From<wgpu::Color>` conversions. Enabled by the renderer;
# off by default so the value types don't drag wgpu into a lean embed.
wgpu = ["dep:wgpu"]
