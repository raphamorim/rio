[package]
name = "rio-backend"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
repository = "https://github.com/raphamorim/rio"
documentation = "https://github.com/raphamorim/rio#readme"
description = "Backend infrastructure for Rio terminal"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
tracing = { workspace = true }

# Most of the former dependencies (corcovado, copypasta, onig-based search,
# simd, image_rs, …) moved with the terminal core to `rio-vt`. What remains
# here is config loading + the sugarloaf renderer glue.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toml = "0.9.2"
base64 = { workspace = true }
regex = { workspace = true }
onig = { workspace = true }
dirs = "6.0.0"
serde = { workspace = true }
rio-graphics = { workspace = true, features = ["glyph"] }
rio-vt = { workspace = true }
sugarloaf = { workspace = true, optional = true }
url = { workspace = true }
# `wgpu` is only needed when the corresponding sugarloaf feature is on.
wgpu = { workspace = true, optional = true }
rio-window = { workspace = true, optional = true }

[features]
default = ["renderer", "wayland", "x11", "rio-window", "graphics"]
# The renderer (sugarloaf) backend. Off makes rio-backend a lean terminal
# core with no GPU/font-shaping deps — this is what `librio-vt` embeds.
renderer = ["dep:sugarloaf", "rio-vt/renderer"]
# Image (sixel/kitty/iTerm2) and glyph protocol decoding. On for the desktop
# frontend; off for lean headless embeds (librio-vt).
graphics = ["rio-vt/graphics"]
# Rio's window layer (rio-window, a winit fork). Pulls in the window types
# and bridges the core's WindowId to rio-window at the frontend boundary.
rio-window = ["dep:rio-window", "rio-vt/rio-window"]
x11 = ["rio-vt/x11"]
wayland = ["rio-vt/wayland"]
# Enable the wgpu backend in sugarloaf (needed on Windows where the
# native Vulkan/Metal backends aren't available, and as an opt-in for
# librashader CRT/scanline filters on Linux/macOS). Implies `renderer`.
wgpu = ["renderer", "dep:wgpu", "sugarloaf/wgpu", "rio-vt/wgpu"]
